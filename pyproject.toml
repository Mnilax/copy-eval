[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copy-eval"
version = "0.1.0"
description = "LLM-as-judge harness for marketing copy — rubric scoring, pairwise Elo, rich reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copyeval"]
